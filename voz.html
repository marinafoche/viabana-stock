<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#d71920">
  <title>Viabana Stock - Prueba de voz</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#fff8e8;color:#333;padding:28px 16px}
    .card{max-width:650px;margin:30px auto;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 8px 25px rgba(0,0,0,.12)}
    .head{background:linear-gradient(135deg,#d71920,#ed1c24);color:#fff;text-align:center;padding:28px 20px;border-bottom:6px solid #f6c400}
    .head h1{margin:0 0 8px;font-size:28px}.head p{margin:0;font-size:17px}
    .body{padding:28px}
    button{width:100%;padding:18px;border:2px solid #222;border-radius:17px;background:#ffd000;font-size:20px;font-weight:800;cursor:pointer}
    button.escuchando{background:#d71920;color:#fff;border-color:#d71920}
    .estado{margin-top:18px;padding:16px;border-radius:13px;background:#fff1b8;text-align:center;font-weight:700}
    .rotulo{font-weight:800;margin:22px 0 8px}
    #texto{min-height:105px;background:#f7f7f7;border:1px solid #ddd;border-radius:13px;padding:16px;font-size:19px;line-height:1.5}
    .ayuda{text-align:center;margin-top:22px;color:#666;line-height:1.5}
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <h1>🎤 Viabana</h1>
      <p>Carga de productos por voz</p>
    </div>
    <div class="body">
      <button id="btn" onclick="dictar()">🎤 Empezar a dictar</button>
      <div id="estado" class="estado">Tocá el botón y decí productos y cantidades.</div>
      <div class="rotulo">Lo que escuché:</div>
      <div id="texto">—</div>
      <div class="ayuda">
        Por ejemplo:<br><br>
        <b>"Dos granizados, un chocolate y tres dulce de leche granizado"</b>
      </div>
    </div>
  </div>

<script>
let reconocimiento = null;
let textoFinal = '';

function enviarAApp(texto) {
  if (!texto) return;
  try {
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({
        tipo: 'VIABANA_VOZ_SALIDA',
        texto: texto
      }, '*');
      document.getElementById('estado').innerHTML =
        '✅ Dictado enviado a Viabana.<br><span style="font-weight:normal">Podés volver a la app.</span>';
      setTimeout(function(){ window.close(); }, 900);
    } else {
      document.getElementById('estado').innerHTML =
        '✅ Dictado recibido correctamente.<br><span style="font-weight:normal">Esta ventana se abrió sin conexión con la app.</span>';
    }
  } catch (e) {
    document.getElementById('estado').textContent = '⚠️ No pude enviar el dictado a la app.';
  }
}

function dictar() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const estado = document.getElementById('estado');
  const texto = document.getElementById('texto');
  const btn = document.getElementById('btn');

  if (!SR) {
    estado.textContent = '⚠️ Este navegador no admite dictado por voz. Usá Google Chrome.';
    return;
  }

  if (reconocimiento) {
    try { reconocimiento.stop(); } catch(e) {}
    return;
  }

  textoFinal = '';
  reconocimiento = new SR();
  reconocimiento.lang = 'es-AR';
  reconocimiento.continuous = false;
  reconocimiento.interimResults = true;

  reconocimiento.onstart = function() {
    btn.classList.add('escuchando');
    btn.textContent = '⏹️ Terminar dictado';
    estado.textContent = '🔴 Escuchando...';
    texto.textContent = '...';
  };

  reconocimiento.onresult = function(event) {
    let parcial = '';
    let final = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const t = event.results[i][0].transcript;
      if (event.results[i].isFinal) final += t + ' ';
      else parcial += t;
    }
    if (final) textoFinal += final;
    texto.textContent = (textoFinal + parcial).trim() || '...';
  };

  reconocimiento.onerror = function(event) {
    let msg = '⚠️ No pude escuchar bien. Probá nuevamente.';
    if (event.error === 'not-allowed') msg = '⚠️ El micrófono está bloqueado para esta página.';
    if (event.error === 'no-speech') msg = '⚠️ No escuché voz. Probá nuevamente hablando cerca del micrófono.';
    estado.textContent = msg;
  };

  reconocimiento.onend = function() {
    const recibido = (textoFinal || texto.textContent || '').trim();
    btn.classList.remove('escuchando');
    btn.textContent = '🎤 Dictar nuevamente';
    reconocimiento = null;

    if (recibido && recibido !== '...' && recibido !== '—') {
      texto.textContent = recibido;
      estado.textContent = '✅ Dictado recibido correctamente.';
      enviarAApp(recibido);
    }
  };

  reconocimiento.start();
}
</script>
</body>
</html>
